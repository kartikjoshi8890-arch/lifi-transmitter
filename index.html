
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Li-Fi Text Transmitter</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #101820;
  color: white;
  text-align: center;
  padding: 25px;
}
.container {
  max-width: 420px;
  margin: auto;
  background: #1d2b36;
  padding: 25px;
  border-radius: 15px;
}
input {
  width: 90%;
  padding: 14px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  margin: 15px 0;
}
button {
  width: 95%;
  padding: 15px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: #00c896;
  color: #101820;
}
button:disabled {
  opacity: 0.45;
}
#status {
  margin-top: 20px;
  line-height: 1.5;
  color: #8be9fd;
}
small {
  color: #bbb;
}
</style>
</head>

<body>
<div class="container">

<h2>LI-FI TRANSMITTER</h2>
<p>Send text using your phone flashlight</p>

<input id="message"
 maxlength="8"
 placeholder="Enter message (1-8 characters)"
 autocomplete="off">

<button id="enable" onclick="enableTorch()">
ENABLE FLASHLIGHT
</button>

<button id="send" onclick="transmit()" disabled>
TRANSMIT MESSAGE
</button>

<button onclick="stopTorch()">
STOP
</button>

<p id="status">Connect your flashlight first.</p>

<small>Keep your phone pointed at the LDR.</small>

</div>

<script>
let stream = null;
let track = null;
let torchState = false;
let busy = false;

const BIT_TIME = 2000;
const START_TIME = 3000;
const SYNC_TIME = 3000;
const END_TIME = 3000;

const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function waitUntil(target) {
  const remaining = target - performance.now();
  if (remaining > 0) await sleep(remaining);
}

async function setTorch(on) {
  if (!track) throw new Error("Flashlight not enabled");

  if (torchState === on) return;

  await track.applyConstraints({
    advanced: [{ torch: on }]
  });

  torchState = on;
}

async function enableTorch() {
  try {
    statusText.textContent = "Requesting camera permission...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    track = stream.getVideoTracks()[0];

    await setTorch(false);

    sendButton.disabled = false;
    statusText.textContent = "Flashlight ready. Enter your message.";

  } catch (error) {
    statusText.textContent =
      "Error: " + error.message +
      ". Allow camera access and use Chrome on Android.";
  }
}

async function transmit() {

  if (!track || busy) return;

  const message =
    document.getElementById("message").value.trim();

  if (message.length < 1 || message.length > 8) {
    statusText.textContent =
      "Enter between 1 and 8 characters.";
    return;
  }

  if (!/^[\x20-\x7E]+$/.test(message)) {
    statusText.textContent =
      "Use English letters, numbers or basic symbols.";
    return;
  }

  busy = true;
  sendButton.disabled = true;

  try {

    statusText.textContent = "Sending start marker...";

    // START MARKER
    await setTorch(true);
    await sleep(START_TIME);

    // SYNCHRONIZATION GAP
    await setTorch(false);
    await sleep(SYNC_TIME);

    // Convert message to bytes
    const bytes = [
      message.length,
      ...Array.from(message).map(c => c.charCodeAt(0))
    ];

    statusText.textContent = "Transmitting message...";

    // Send each byte, most significant bit first
    let slotStart = performance.now();

    for (const value of bytes) {

      for (let bit = 7; bit >= 0; bit--) {

        const bitValue = (value >> bit) & 1;

        await setTorch(bitValue === 1);

        slotStart += BIT_TIME;
        await waitUntil(slotStart);
      }
    }

    // END MARKER
    await setTorch(true);
    await sleep(END_TIME);

    await setTorch(false);

    statusText.textContent =
      "Transmission completed: " + message;

  } catch (error) {

    statusText.textContent =
      "Transmission error: " + error.message;

    try {
      await setTorch(false);
    } catch (e) {}

  } finally {

    busy = false;
    sendButton.disabled = false;
  }
}

async function stopTorch() {

  try {
    busy = false;

    if (track) {
      await setTorch(false);
    }

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    track = null;
    stream = null;
    torchState = false;

    sendButton.disabled = true;
    statusText.textContent = "Flashlight stopped.";

  } catch (error) {
    statusText.textContent = error.message;
  }
}
</script>

</body>
</html>

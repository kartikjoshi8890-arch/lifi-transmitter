
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Li-Fi Text Communication</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  background: #101820;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
  background: #1d2b36;
  border-radius: 18px;
}

h1 {
  color: #00d6a0;
  font-size: 25px;
}

p {
  color: #cbd5e1;
}

input {
  width: 100%;
  padding: 15px;
  margin: 18px 0;
  border: none;
  border-radius: 9px;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 9px;
  background: #00d6a0;
  color: #101820;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: 0.4;
}

.stop {
  background: #ff6464;
}

#status {
  margin-top: 20px;
  color: #8be9fd;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.small {
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>LI-FI COMMUNICATION</h1>

<p>Transmit text using your phone flashlight</p>

<input
  id="message"
  type="text"
  maxlength="8"
  placeholder="Enter message (1-8 characters)"
>

<button id="enable" onclick="enableTorch()">
ENABLE FLASHLIGHT
</button>

<button id="send" onclick="transmit()" disabled>
TRANSMIT MESSAGE
</button>

<button class="stop" onclick="stopTransmission()">
STOP
</button>

<p id="status">Waiting for flashlight connection...</p>

<p class="small">
Keep your phone flashlight pointed directly at the LDR.
</p>

</div>

<script>

const BIT_TIME = 2000;
const START_TIME = 3000;
const SYNC_TIME = 3000;

let stream = null;
let track = null;
let torchState = false;
let busy = false;
let cancelled = false;

const statusBox = document.getElementById("status");
const sendButton = document.getElementById("send");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function setTorch(value) {

  if (!track) {
    throw new Error("Flashlight is not connected");
  }

  if (torchState === value) return;

  await track.applyConstraints({
    advanced: [{ torch: value }]
  });

  torchState = value;
}

async function enableTorch() {

  try {

    statusBox.innerText = "Requesting camera permission...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" }
      }
    });

    track = stream.getVideoTracks()[0];

    // Explicitly initialize flashlight OFF
    await track.applyConstraints({
      advanced: [{ torch: false }]
    });

    torchState = false;

    sendButton.disabled = false;

    statusBox.innerText =
      "Flashlight connected. Ready to transmit.";

  } catch (error) {

    statusBox.innerText =
      "Camera/flashlight error: " + error.message;
  }
}

async function transmit() {

  if (!track || busy) return;

  const message =
    document.getElementById("message").value.trim();

  if (message.length < 1 || message.length > 8) {

    statusBox.innerText =
      "Enter a message between 1 and 8 characters.";

    return;
  }

  if (!/^[\x20-\x7E]+$/.test(message)) {

    statusBox.innerText =
      "Use English letters, numbers or basic symbols.";

    return;
  }

  busy = true;
  cancelled = false;
  sendButton.disabled = true;

  try {

    statusBox.innerText = "Sending START marker...";

    // STEP 1: START MARKER - 3 SECONDS ON

    await setTorch(true);
    await sleep(START_TIME);

    if (cancelled) throw new Error("Stopped");

    // STEP 2: SYNCHRONIZATION - 3 SECONDS OFF

    await setTorch(false);
    await sleep(SYNC_TIME);

    if (cancelled) throw new Error("Stopped");

    // STEP 3: CONVERT MESSAGE TO ASCII BYTES

    const bytes = [
      message.length,
      ...Array.from(message).map(c => c.charCodeAt(0))
    ];

    statusBox.innerText =
      "Transmitting: " + message;

    // STEP 4: SEND ALL BITS, MSB FIRST

    const totalBits = bytes.length * 8;

    const frameStart = performance.now();

    let bitNumber = 0;

    for (const value of bytes) {

      for (let bit = 7; bit >= 0; bit--) {

        if (cancelled) {
          throw new Error("Transmission stopped");
        }

        const bitValue = (value >> bit) & 1;

        // ON represents 1; OFF represents 0
        await setTorch(bitValue === 1);

        // Fixed deadlines prevent cumulative timing drift
        const deadline =
          frameStart + (++bitNumber * BIT_TIME);

        const remaining = deadline - performance.now();

        if (remaining > 0) {
          await sleep(remaining);
        }
      }
    }

    // STEP 5: END TRANSMISSION IN OFF STATE

    await setTorch(false);

    statusBox.innerText =
      "SUCCESS! Message transmitted: " + message;

  } catch (error) {

    statusBox.innerText = error.message;

    try {
      await setTorch(false);
    } catch (e) {}

  } finally {

    busy = false;
    sendButton.disabled = !track;
  }
}

async function stopTransmission() {

  cancelled = true;
  busy = false;

  try {

    if (track) {
      await track.applyConstraints({
        advanced: [{ torch: false }]
      });
    }

  } catch (e) {}

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  stream = null;
  track = null;
  torchState = false;

  sendButton.disabled = true;

  statusBox.innerText = "Transmission stopped.";
}

</script>

</body>
</html>


<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Li-Fi Text Transmitter</title>

<style>
body {
  background: #101820;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
h1 { color: #55d6ff; }
input {
  width: 90%;
  padding: 14px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  margin: 15px 0;
  box-sizing: border-box;
}
button {
  width: 90%;
  padding: 15px;
  margin: 8px;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
}
#send { background: #16a085; color: white; }
#connect { background: #2980b9; color: white; }
#status { color: #55d6ff; }
</style>
</head>

<body>

<h1>Li-Fi Transmitter</h1>
<p>Smartphone to Arduino Communication</p>

<button id="connect" onclick="startCamera()">
Enable Flashlight
</button>

<input id="message" type="text"
placeholder="Enter message (max 8 characters)"
maxlength="8" value="HELLO">

<button id="send" onclick="transmit()">
TRANSMIT MESSAGE
</button>

<h3 id="status">Status: Not connected</h3>
<p id="progress">Waiting for transmission</p>

<script>
let track = null;
let torchState = null;
let sending = false;

const BIT_TIME = 700;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function startCamera() {
  try {
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });

    track = stream.getVideoTracks()[0];

    const capabilities = track.getCapabilities();

    if (!capabilities.torch) {
      document.getElementById("status").innerText =
        "Torch not supported";
      return;
    }

    document.getElementById("status").innerText =
      "Status: Transmitter ready";

    await setTorch(false);

  } catch (error) {
    document.getElementById("status").innerText =
      "Error: " + error.message;
  }
}

async function setTorch(value) {
  if (!track) throw new Error("Enable flashlight first");

  if (torchState === value) return;

  await track.applyConstraints({
    advanced: [{ torch: value }]
  });

  torchState = value;
}

async function sendBit(bit) {
  await setTorch(bit === "1");
  await sleep(BIT_TIME);
}

async function sendByte(value) {
  const binary = value.toString(2).padStart(8, "0");

  for (const bit of binary) {
    await sendBit(bit);
  }
}

async function transmit() {
  if (sending) return;

  const input = document.getElementById("message");
  const message = input.value.toUpperCase();

  if (!track) {
    alert("First enable the flashlight!");
    return;
  }

  if (!message || message.length > 8 ||
      !/^[\x20-\x7E]+$/.test(message)) {
    alert("Enter 1 to 8 basic English characters.");
    return;
  }

  sending = true;
  document.getElementById("send").disabled = true;

  try {
    document.getElementById("status").innerText =
      "Status: Sending message";

    document.getElementById("progress").innerText =
      "Sending start signal...";

    // Start marker: 1800 ms ON
    await setTorch(true);
    await sleep(1800);

    // Synchronization gap: 1800 ms OFF
    await setTorch(false);
    await sleep(1800);

    // Send message length as one byte
    await sendByte(message.length);

    // Send ASCII characters
    for (let i = 0; i < message.length; i++) {
      document.getElementById("progress").innerText =
        "Transmitting: " + message[i] +
        " (" + (i + 1) + "/" + message.length + ")";

      await sendByte(message.charCodeAt(i));
    }

    await setTorch(false);

    document.getElementById("status").innerText =
      "Transmission complete!";

    document.getElementById("progress").innerText =
      "Message sent: " + message;

  } catch (error) {
    document.getElementById("status").innerText =
      "Transmission error: " + error.message;

  } finally {
    try {
      await setTorch(false);
    } catch (e) {}

    sending = false;
    document.getElementById("send").disabled = false;
  }
}
</script>

</body>
</html>
